name: CrisisAI OpenEnv Environment
version: "1.0.0"
description: >
  OpenEnv RL environment for AI Crisis Response & Rescue Coordination.
  3 difficulty tasks covering threat classification, impact prediction,
  and full crisis response.

environment:
  type: openenv
  base_url: https://praveen4278-crisis-ai-env.hf.space
  health_endpoint: /health

endpoints:
  reset:
    method: POST
    path: /reset
  step:
    method: POST
    path: /step
  state:
    method: GET
    path: /state
  tasks:
    method: GET
    path: /tasks
  health:
    method: GET
    path: /health

tasks:
  - id: task_easy
    name: Threat Classification
    difficulty: easy
    description: Classify incoming threats by type and severity.
    grader_range: [0.0, 1.0]

  - id: task_medium
    name: Impact Prediction
    difficulty: medium
    description: Predict time-to-impact and population-at-risk for each threat.
    grader_range: [0.0, 1.0]

  - id: task_hard
    name: Full Crisis Response
    difficulty: hard
    description: Allocate resources, coordinate priorities, and execute rescue operations.
    grader_range: [0.0, 1.0]